# Publish to Docker Hub

name: publish-docker
on:
  push:
    # Every push to main rebuilds the (main) image.
    branches: [main]
    # Version tags (created by semantic-release) build (<semver>) and (latest).
    tags: ["v*"]
  # Allow manual triggers (e.g. to re-publish a specific version)
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.3)"
        required: false
        type: string

env:
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # Scope by ref so the release's main push and its v-tag push (near-simultaneous,
  # different refs, different images) don't cancel each other. Two pushes to the
  # same ref still supersede the older build, which is what we want.
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Job information
        run: echo ${{ github.workflow }}-${{ github.ref }}
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            # Docker Hub
            ${{ env.IMAGE_NAME }}
          # The latest semver tag push also gets a (latest) entry.
          flavor: |
            latest=auto
            prefix=
            suffix=
          # refs/heads/main   -> (main)
          # refs/tags/v1.2.3  -> (1.2.3), (1.2), (1), (latest)
          # workflow_dispatch with version=1.2.3 -> same semver tags + (latest)
          tags: |
            # Branch pushes: refs/heads/main -> (main)
            type=ref,event=branch
            # Tag pushes: semver derived from the git ref (v1.2.3 -> 1.2.3, 1.2, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            # Manual dispatch fallback: semver derived from the version input
            type=raw,value=latest,enable=${{ github.event.inputs.version != '' }}
            type=semver,pattern={{version}},value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' && !startsWith(github.event.inputs.version, '0.') }}
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
